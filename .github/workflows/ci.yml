name: Validación
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm ci
      - run: npm run check
      - run: npx expo export --platform android --platform web
        working-directory: frontend

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # Levanta Postgres, Auth y la API y aplica todas las migraciones desde una base vacía (CA-10).
      - run: supabase start --workdir backend -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api,supavisor,postgres-meta
      - run: supabase db lint --workdir backend --level warning --fail-on error
      # Pruebas pgTAP de RLS y acceso cruzado (RNF-04, CA-01).
      - run: supabase test db --workdir backend
      # Los tipos de la app deben corresponder a las migraciones (npm run db:types).
      - run: |
          supabase gen types typescript --local --workdir backend --schema public > packages/contracts/src/database.types.ts
          git diff --exit-code -- packages/contracts/src/database.types.ts
      # Repositorios de la app contra RLS real (SY-01).
      - run: npm run test:integration
